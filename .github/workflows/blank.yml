name: Build TWRP 8.1 for pufferx8

on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备代号'
        required: true
        default: 'pufferx8'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip python3 python3-pip python-is-python3 \
            libssl-dev bc ccache

      - name: Setup repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Sync TWRP 8.1 sources
        run: |
          mkdir twrp && cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-8.1 --depth=1
          repo sync -j$(nproc) --force-sync --no-tags --no-clone-bundle
        env:
          GIT_TERMINAL_PROMPT: 0

      - name: Clone device tree (pufferx8)
        run: |
          git clone https://github.com/TechNetSpace/android_device_xiaodu_pufferx8.git \
            --depth=1 \
            twrp/device/xiaodu/pufferx8

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-twrp8.1-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-twrp8.1-${{ github.ref }}-
            ${{ runner.os }}-ccache-twrp8.1-

      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -o compression=true

      - name: Build recovery
        run: |
          cd twrp
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          . build/envsetup.sh
          lunch omni_${{ github.event.inputs.device }}-eng
          make recoveryimage -j$(nproc)

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.event.inputs.device }}
          path: twrp/out/target/product/${{ github.event.inputs.device }}/recovery.img
